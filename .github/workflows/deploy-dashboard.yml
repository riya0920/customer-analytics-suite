name: deploy-dashboard

# Publishes GitHub Pages:
#   /      the one-page dashboard, docs/index.html (built by build_dashboard.py)
#   /app/  the React dashboard in frontend/
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub
# Actions. After that this runs on every push to main that touches the frontend.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        # Served from https://<user>.github.io/customer-analytics-suite/app/
        env:
          BASE_PATH: /customer-analytics-suite/app/
        run: npm run build
      - name: Assemble site
        working-directory: .
        run: |
          mkdir -p site/app
          cp docs/index.html site/index.html
          cp -r frontend/dist/. site/app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
