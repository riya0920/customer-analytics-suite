# DuckDB rather than a warehouse, and that is the whole substitution: the SQL,
# the model graph, the tests and the lineage are real dbt; only the engine is
# embedded. Everything here would run on Snowflake or BigQuery with a profile
# change and no model edits.
retail_customer_analytics:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ../data/warehouse.duckdb
      threads: 4
    # The whole substitution the comment above promises: the SAME models, graph
    # and tests run on Snowflake by selecting this target
    # (`dbt build --target snowflake`). Credentials come from the environment; no
    # model edits. Load the raw tables first with `python land_snowflake.py`.
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'SYSADMIN') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'CUSTOMER_ANALYTICS') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'main') }}"
      threads: 4
